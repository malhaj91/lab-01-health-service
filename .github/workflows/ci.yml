name: Java CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab-01-health-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: lab-01-health-service/pom.xml

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress verify

  container-build:
    name: Container image build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build container image
        run: >
          docker build
          --tag health-service:${{ github.sha }}
          ./lab-01-health-service
